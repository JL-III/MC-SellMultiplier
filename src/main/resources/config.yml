# SellMultiplier configuration
#
# Each 'sell.multiplier.<key>' permission a player has grants the bonus listed
# below. Values are decimals where 0.25 = +25%.
#
# Bonuses are ADDITIVE. A player's sell payout multiplier is:
#     1 + (sum of the values of EVERY sell.multiplier.* permission they have)
#
# Example: a player with sell.multiplier.weekend (0.25) and the five
#          sell.multiplier.community-goal-N perms (0.10 each) sells for
#          1 + 0.25 + 0.50 = 1.75  ->  a +75% sell bonus.
#
# Any sell.multiplier.* permission that is NOT listed here falls back to
# 'default-bonus'. Permissions explicitly set to false are ignored.
default-bonus: 0.10

sell-multipliers:
  # Rank multipliers. Assign exactly ONE per player and make sure ranks do not
  # inherit the lower ranks in LuckPerms, otherwise they will stack additively.
  i: 0.10
  ii: 0.20
  iii: 0.30
  iiii: 0.40
  v: 0.50

  # Event multiplier. Set manually for the duration of an event, e.g.:
  #   lp group default permission settemp sell.multiplier.weekend true 2day
  weekend: 0.25

  # Community activity goals. Granted automatically by the TheatriaSessions
  # plugin as the community hits daily playtime milestones. They are intended to
  # stack additively (goal-1..5 = +50% total at the top tier). The values here
  # are the single source of truth for what each tier is worth -- TheatriaSessions
  # only grants the permission node; it does not set the percentage.
  community-goal-1: 0.10
  community-goal-2: 0.10
  community-goal-3: 0.10
  community-goal-4: 0.10
  community-goal-5: 0.10
